<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e3">
<title>for Noor 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6f9c;--ink:#7a3a52;--cream:#fff4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd4dd;font-family:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;
 background:radial-gradient(120% 90% at 50% 30%,#ffe6ee,#ffd0df 60%,#ffc2d6);transition:opacity 1.1s ease,transform 1.1s ease}
#intro.hide{opacity:0;pointer-events:none;transform:scale(1.04)}
#intro svg{filter:drop-shadow(0 8px 14px rgba(255,111,156,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
#intro h1{margin:0;font:700 clamp(46px,12vw,72px) 'Caveat',cursive;color:var(--ink)}
#intro p{margin:0;font-weight:700;opacity:.75}
#go{font:800 20px 'Nunito',sans-serif;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:14px 38px;box-shadow:0 8px 18px rgba(255,111,156,.45);cursor:pointer;transition:transform .15s,opacity .3s}
#go:disabled{opacity:.55;cursor:default} #go:not(:disabled):active{transform:scale(.96)}
#track{width:180px;height:5px;border-radius:5px;background:rgba(122,58,82,.15);overflow:hidden} #bar{height:100%;width:0;background:var(--pink);transition:width .2s}
#loadhint{font-size:14px;min-height:1.4em;max-width:340px}
#mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.7);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
#bubble{position:fixed;z-index:8;transform:translate(-50%,-118%) scale(.6);opacity:0;pointer-events:none;background:#fff;color:var(--ink);font:800 clamp(18px,4.6vw,24px) 'Nunito',sans-serif;padding:11px 18px;border-radius:20px;
 box-shadow:0 8px 22px rgba(122,58,82,.22);max-width:78vw;text-align:center;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
#bubble.show{opacity:1;transform:translate(-50%,-118%) scale(1)}
#bubble::after{content:'';position:absolute;left:50%;bottom:-9px;width:18px;height:18px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#note{position:fixed;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));text-align:center;z-index:5;font:600 26px 'Caveat',cursive;color:#fff;text-shadow:0 2px 8px rgba(80,60,90,.5);opacity:.95;transition:opacity 1s;pointer-events:none}
#note.gone{opacity:0}
#letter{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:16px;background:rgba(70,35,55,.45);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .6s}
#letter.show{opacity:1;pointer-events:auto}
#paper{width:min(94vw,540px);max-height:88vh;overflow:auto;background:linear-gradient(#fffaf2,#fff3e6);border-radius:8px;padding:30px 28px 22px;box-shadow:0 20px 50px rgba(60,30,50,.35);transform:rotate(-.8deg) scale(.94);transition:transform .7s cubic-bezier(.2,1.2,.4,1);font:500 clamp(22px,5.4vw,27px)/1.35 'Caveat',cursive;color:#5a3a4a;border-top:6px solid #ffc2d4}
#letter.show #paper{transform:rotate(-.8deg) scale(1)}
#paper p{margin:0 0 .7em} #paper .to{font-size:1.25em;font-weight:700} #paper .last{font-weight:700;color:#d6406f}
#paper span{opacity:0;transition:opacity .7s} #paper span.on{opacity:1} #paper .sig{text-align:right;transition:opacity 1s;margin:.2em 0 0}
#close{display:block;margin:14px auto 0;font:800 17px 'Nunito',sans-serif;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:11px 28px;opacity:0;pointer-events:none;transition:opacity .6s;cursor:pointer}
#close.show{opacity:1;pointer-events:auto}
#end{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));z-index:9;text-align:center;opacity:0;pointer-events:none;transition:opacity 2s}
#end.show{opacity:1;pointer-events:auto}
#endtext{font:700 clamp(38px,10vw,56px) 'Caveat',cursive;color:#fff;text-shadow:0 3px 14px rgba(122,58,82,.55)}
#replay{margin-top:6px;font:800 15px 'Nunito',sans-serif;background:rgba(255,255,255,.8);color:var(--ink);border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
#credit{position:fixed;left:10px;bottom:6px;z-index:4;font-size:10px;opacity:.55;color:#fff} #credit a{color:inherit}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bubble"></div>
<div id="note">something small, just for you 🌸</div>
<button id="mute" aria-label="sound">🔊</button>
<div id="letter"><div id="paper"><div id="lettertext"></div><button id="close">close the letter ✉</button></div></div>
<div id="end"><div id="endtext"></div><button id="replay">watch again ↻</button></div>
